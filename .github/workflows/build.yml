name: Build and Release Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=PrestaFacil" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=prestafacil-alias" >> gradle.properties
            echo "RELEASE_KEY_PASSWORD=PrestaFacil" >> gradle.properties
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alice-debug-apk
          path: app/build/outputs/apk/debug/*.apk
